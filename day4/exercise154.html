<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  *{
    padding: 0;
    margin: 0;
  }
  div{
    width: 100%;
    height: 100vh;
  }
  button{
    position: relative;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 40px;
    width: 75px;
    background-color: tomato;
    border: none;
    border-radius: 5px;
    color: white;
  }
  #cnt{
    position: absolute;
    height: 20px;
    width: 20px;
    border-radius: 100%;
    border: 1px solid black;
    background-color: black;;
    top: -10px;
    right: -10px;
    color: white;
  }
</style>
<body>
  <div>
    <button type="btn" class="btn" id="btn" onclick="updateCnt()">Click!
      <p id="cnt">0</p>
    </button>
  </div>
</body>
<script>
  function updateCnt(){
    let btn = document.getElementById("cnt");
    let val = parseInt(btn.textContent) + 1;
    btn.innerHTML = val;
  }
</script>
</html>
