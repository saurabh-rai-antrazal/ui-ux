<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .box1 {
      background-color: #f44336;
      width: 100px;
      height: 100px;
      position: relative;
      top: 0;
      left: 0;
    }

    .box2 {
      background-color: #e91e63;
      width: 100px;
      height: 100px;
      position: relative;
      top: 0;
      right: 0;
    }

    .box3 {
      background-color: #9c27b0;
      width: 100px;
      height: 100px;
      position: relative;
      bottom: 0;
      left: 0;
    }

    .box4 {
      background-color: #3f51b5;
      width: 100px;
      height: 100px;
      position: relative;
      bottom: 0;
      right: 0;
    }
  </style>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
  </body>
</html>
