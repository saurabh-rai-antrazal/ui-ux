<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .container {
      position: relative;
      background-color: red;
      width: 400px;
      height: 400px;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: blue;
      position: absolute;
      right: -50px;
      top: 150px;
    }
  </style>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
