<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    div{
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom right, white, tomato);
    }
    button{
      margin: 10px;
      border: 1px solid white;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 3px;
      box-shadow: 2px 2px 5px black;
      transition: all .3s ease-in-out;
    }

    #btn1:hover{
      transform: translateY(-3px);
    }

    #btn2:hover{
      transform: scale(0.9);
    }
  </style>
  <body>
    <div>
      <button id="btn1">click btn!</button>
      <button id="btn2">click btn!!</button>
    </div>
  </body>
</html>
