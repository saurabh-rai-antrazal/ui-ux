<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  h1 {
  font-size: 5rem;
  text-align:center;
}
.container  {
  background-color: #283593;
  margin: 0 auto;
  width: 1200px;
  height: 800px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  align-content: center;
}
span {
  width: 250px;
  color: white;
  background-color: #26C6DA;
  font-size: 3rem;
  border: 1px solid black;
  text-align:center;
  border-radius: 20px;
}
</style>
<body>
  <h1>Flexbox Exercise</h1>
<div class="container">
  <span>FIRST</span>
  <span>SECOND</span>
  <span>THIRD</span>
  <span>FOURTH</span>
  <span>FIFTH</span>
  <span>SIXTH</span>
  <span>SEVENTH</span>
</div>
</body>
</html>
