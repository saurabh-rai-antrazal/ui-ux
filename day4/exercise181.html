<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    h1 {
      font-size: 5rem;
      text-align: center;
    }
    .container {
      background-color: #283593;
      margin: 0 auto;
      width: 1200px;
      height: 800px;
      display: flex;
      justify-content: end;
      align-items: end;
    }

    span {
      width: 250px;
      color: white;
      background-color: #26c6da;
      font-size: 3rem;
      border: 1px solid black;
      text-align: center;
      border-radius: 20px;
    }
    #third-span{
      align-self: start;
    }

  </style>
  <body>
    <h1>Flexbox Exercise</h1>
    <div class="container">
      <span>FIRST</span>
      <span>SECOND</span>
      <span id="third-span">THIRD</span>
      <span>FOURTH</span>
    </div>
  </body>
</html>
