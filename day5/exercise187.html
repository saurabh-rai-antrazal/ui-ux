<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    nav {
      width: 100vw;
      align-items: center;
      height: 5em;
      background-color: black;
    }
    a {
      margin-left: 1em;
      color: white;
      font-weight: 400;
      text-decoration: none;
    }
    div{
      margin: 0 auto;
      display: flex;
      height: 100%;
      display: flex;
      gap: 1em;
      align-items: center;
      max-width: 50em;
    }
    a:hover{
      text-decoration: underline;
    }
    .right{
      margin-left: auto;
      margin-right: 1em;
    }
  </style>
  <body>
    <nav>
      <div>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Projects</a>
        <a class="right" href="">Signup/Login</a>
      </div>
    </nav>
  </body>
</html>
